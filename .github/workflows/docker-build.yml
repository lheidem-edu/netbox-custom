---
name: docker-build

on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        - cron: "23 4 * * *"
    workflow_dispatch:
        inputs:
            force:
                description: "publish-even-if-nothing-changed"
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    UPSTREAM_IMAGE: docker.io/netboxcommunity/netbox:latest
    TEST_IMAGE: netbox-custom:latest
    FINGERPRINT_LABEL: org.github.lheidem-edu.netbox-custom.fingerprint
    COMPOSE_FILE: tests/docker-compose.yml

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup-qemu
              uses: docker/setup-qemu-action@v3
            - name: setup-buildx
              uses: docker/setup-buildx-action@v3

            - name: login-ghcr
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: resolve-images
              id: resolve_images
              run: |
                  digest=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
                  echo "upstream=${UPSTREAM_IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
                  echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: build-test-image
              uses: docker/build-push-action@v7
              with:
                  build-args: NETBOX_IMAGE=${{ steps.resolve_images.outputs.upstream }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  load: true
                  platforms: linux/amd64
                  tags: ${{ env.TEST_IMAGE }}

            - name: retrieve-versions
              id: retrieve_versions
              run: |
                  py() { docker run --rm "$TEST_IMAGE" /opt/netbox/venv/bin/python -c "$1"; }
                  netbox_version=$(py "import yaml; print(yaml.safe_load(open('/opt/netbox/netbox/release.yaml'))['version'])")
                  netbox_plugin_dns_version=$(py "from importlib.metadata import version; print(version('netbox-plugin-dns'))")
                  echo "netbox_version=$netbox_version" >> "$GITHUB_OUTPUT"
                  echo "netbox_major=$(cut -d. -f1 <<< "$netbox_version")" >> "$GITHUB_OUTPUT"
                  echo "netbox_minor=$(cut -d. -f1,2 <<< "$netbox_version")" >> "$GITHUB_OUTPUT"
                  echo "netbox_plugin_dns_version=$netbox_plugin_dns_version" >> "$GITHUB_OUTPUT"

            - name: calculate-fingerprint
              id: calculate_fingerprint
              run: |
                  freeze=$(docker run --rm "$TEST_IMAGE" /usr/local/bin/uv pip freeze --python /opt/netbox/venv/bin/python)
                  fingerprint=$(
                      {
                          echo "${{ steps.resolve_images.outputs.upstream }}"
                          echo "netbox==${{ steps.retrieve_versions.outputs.netbox_version }}"
                          echo "$freeze"
                          cat Dockerfile src/*
                      } | sha256sum | cut -d' ' -f1
                  )
                  echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

            - name: run-smoke-tests
              run: |
                  manage() { docker compose exec -T netbox /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py "$@"; }
                  docker compose up -d --wait --wait-timeout 900
                  manage check
                  migrations=$(manage showmigrations netbox_dns)
                  echo "$migrations"
                  if grep -q '\[ \]' <<< "$migrations"; then echo "::error::unapplied-netbox-dns-migrations"; exit 1; fi
                  manage shell -c "from netbox_dns.models import Zone; print('netbox_dns zones:', Zone.objects.count())"

            - name: logs-on-failure
              if: failure()
              run: docker compose logs netbox

            - name: compare-with-published
              id: compare_with_published
              if: github.event_name != 'pull_request'
              run: |
                  published=$(docker buildx imagetools inspect "${{ steps.resolve_images.outputs.image }}:latest" --format '{{json .Image}}' 2>/dev/null \
                      | jq -r --arg label "$FINGERPRINT_LABEL" '(if has("config") then . else first(.[]) end).config.Labels[$label] // ""' || true)
                  echo "published fingerprint: ${published:-<none>}"
                  if [ "${{ inputs.force }}" != "true" ] && [ "${{ steps.calculate_fingerprint.outputs.value }}" = "$published" ]; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: build-and-push
              if: steps.compare_with_published.outputs.publish == 'true'
              uses: docker/build-push-action@v7
              with:
                  build-args: NETBOX_IMAGE=${{ steps.resolve_images.outputs.upstream }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  labels: |
                      org.opencontainers.image.title=netbox-custom
                      org.opencontainers.image.version=v${{ steps.retrieve_versions.outputs.netbox_version }}
                      org.opencontainers.image.base.name=${{ steps.resolve_images.outputs.upstream }}
                      ${{ env.FINGERPRINT_LABEL }}=${{ steps.calculate_fingerprint.outputs.value }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ steps.resolve_images.outputs.image }}:latest
                      ${{ steps.resolve_images.outputs.image }}:v${{ steps.retrieve_versions.outputs.netbox_major }}
                      ${{ steps.resolve_images.outputs.image }}:v${{ steps.retrieve_versions.outputs.netbox_minor }}
                      ${{ steps.resolve_images.outputs.image }}:v${{ steps.retrieve_versions.outputs.netbox_version }}
                      ${{ steps.resolve_images.outputs.image }}:v${{ steps.retrieve_versions.outputs.netbox_version }}-plugin-dns-v${{ steps.retrieve_versions.outputs.netbox_plugin_dns_version }}
